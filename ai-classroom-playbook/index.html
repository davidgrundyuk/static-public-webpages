        const slow = S.speed.length - g - d;
        return `<section class="screen">${stepLabel()}<h2 class="q">Instincts locked in</h2><p class="sub">${k === 'guide' ? 'You leaned towards <b>teaching and coaching</b>.' : k === 'guard' ? 'You leaned towards <b>guarding and protecting</b>.' : 'You leaned <b>both ways equally</b>.'} It shapes your playbook and your archetype.</p>
          <div class="speed"><div class="count">${g} coach · ${d} guard${slow ? ` · ${slow} no answer` : ''}</div></div>
          ${nextBar(true)}</section>`;
      }
      const p = SPEED_PAIRS[S.speedIdx];
      const flip = (hashStr(p.guard + S.seed) & 1) === 1;
      const a = flip ? ['guide', p.guide] : ['guard', p.guard], b = flip ? ['guard', p.guard] : ['guide', p.guide];
      return `<section class="screen">${stepLabel()}<h2 class="q">Speed round</h2>
        <div class="speed"><div class="count">${S.speedIdx + 1} of ${SPEED_PAIRS.length}</div>${S.untimed ? '' : '<div class="timer" aria-hidden="true"><i id="tbar"></i></div>'}
        <div class="vs"><button class="opt" data-act="speedpick" data-v="${a[0]}">${esc(a[1])}</button><span class="or" aria-hidden="true">or</span><button class="opt" data-act="speedpick" data-v="${b[0]}">${esc(b[1])}</button></div></div></section>`;
    },
    surrender() {
      if (!S.scen.length) S.scen = chooseScenarios();
      const defs = `<div class="defs"><div class="def"><b>Smart offload:</b> AI takes a task, but the student stays in charge of the thinking.</div><div class="def s"><b>Cognitive surrender:</b> the student accepts what AI says, and the thinking never happens.</div></div>`;
      if (S.scenIdx >= S.scen.length) {
        const right = S.scen.filter((s, i) => SCENARIOS[s].answer === S.scenAns[i]).length;
        return `<section class="screen">${stepLabel()}<h2 class="q">You spotted ${right} of ${S.scen.length}</h2>
          <p class="sub">${right === S.scen.length ? 'Sharp eye. Now the challenge is helping students see the line for themselves.' : 'The line is genuinely hard to see, which is exactly why students need it taught explicitly.'}</p>${defs}
          ${nextBar(true)}</section>`;
      }
      const sc = SCENARIOS[S.scen[S.scenIdx]];
      const answered = S.scenAns[S.scenIdx];
      const fb = answered ? `<div class="feedback ${answered === sc.answer ? 'ok' : 'no'}" tabindex="-1"><b>${answered === sc.answer ? 'Yes.' : 'Not quite.'}</b> ${sc.answer === 'offload' ? 'Smart offload' : 'Cognitive surrender'}: ${esc(sc.why)}</div>` : '';
      const btn = (v, icon, label) => `<button class="tile center" data-act="scen" data-v="${v}" ${answered ? 'disabled' : ''} aria-pressed="${answered === v}"><b><span aria-hidden="true">${icon} </span>${label}</b></button>`;
      return `<section class="screen">${stepLabel()}<h2 class="q">Offload or surrender?</h2>${S.scenIdx === 0 ? defs : ''}
        <div class="scenario"><div class="who">Student ${S.scenIdx + 1} of ${S.scen.length}</div><p class="txt" id="scentxt" tabindex="-1">${esc(sc.text)}</p>
        <div class="grid grid-2">${btn('offload', '✅', 'Smart offload')}${btn('surrender', '🏳️', 'Surrender')}</div>${fb}</div>
        ${answered ? '<div class="stick"><button class="btn btn-dark btn-wide" data-act="scennext">Next</button></div>' : ''}</section>`;
    },
    worries() {
      const tiles = WORRIES.map(w => `<button class="tile multi" data-act="worry" data-v="${attr(w.id)}" aria-pressed="${S.worries.includes(w.id)}"><span class="ic" aria-hidden="true">${esc(w.icon)}</span><b>${esc(w.label)}</b><small>${esc(w.blurb)}</small></button>`).join('');
      return `<section class="screen">${stepLabel()}<h2 class="q">What keeps you up at night?</h2><p class="sub">Pick your top two. <span class="pill-count">${S.worries.length} of 2</span></p>
        <div class="grid grid-2 grid-4s">${tiles}</div>${nextBar(S.worries.length === 2)}</section>`;
    },
    persona() {
      const tiles = PERSONAS.map(p => `<button class="tile row" data-act="persona" data-v="${attr(p.id)}" aria-pressed="${S.persona === p.id}"><span class="ic" aria-hidden="true">${esc(p.icon)}</span><span><b>${esc(p.label)}</b><br><small>${esc(p.blurb)}</small></span></button>`).join('');
      return `<section class="screen">${stepLabel()}<h2 class="q">${SUBJECTS[S.subject] && SUBJECTS[S.subject].leader ? 'Picture one class in your school. Who are they?' : 'Picture one class. Who are they?'}</h2><p class="sub">When it comes to AI, most of them are…</p><div class="grid">${tiles}</div></section>`;
    },
    kit() {
      const seg = (key, label, opts) => `<fieldset class="seg-group"><legend class="lbl">${label}</legend><div class="seg">${opts.map(([v, t]) => `<button data-act="kit" data-k="${key}" data-v="${v}" aria-pressed="${S[key] === v}">${t}</button>`).join('')}</div></fieldset>`;
      return `<section class="screen">${stepLabel()}<h2 class="q">Kit check</h2><p class="sub">Three quick taps so your ideas fit your room.</p>
        ${seg('devices', 'Student devices in your lessons', [['none', 'None'], ['shared', 'Shared or sometimes'], ['one', 'One each']])}
        ${seg('policy', 'Your school’s rules on student AI use', [['none', 'No policy yet'], ['progress', 'In progress'], ['ban', 'Banned in school'], ['have', 'Allowed with rules']])}
        ${seg('tool', 'An approved AI tool at school', [['none', 'None'], ['copilot', 'Microsoft Copilot'], ['gemini', 'Google Gemini'], ['other', 'Other or not sure']])}
        ${S.devices && S.policy && S.tool ? '' : '<p class="small hint">Answer all three to continue.</p>'}
        ${nextBar(S.devices && S.policy && S.tool)}</section>`;
    },
    confidence() {
      const tiles = CONFIDENCE.map(c => `<button class="tile" data-act="conf" data-v="${c.v}" aria-pressed="${S.confidence === c.v}"><span class="ic" aria-hidden="true">${esc(c.icon)}</span><small>${esc(c.label)}</small></button>`).join('');
      return `<section class="screen">${stepLabel()}<h2 class="q">Honestly: how confident are you with AI yourself?</h2><p class="sub">No judgement. It changes where your playbook starts.</p><div class="conf">${tiles}</div></section>`;
    },
    time() {
      const tiles = TIMES.map(t => `<button class="tile row" data-act="time" data-v="${attr(t.id)}" aria-pressed="${S.time === t.id}"><span class="ic" aria-hidden="true">${esc(t.icon)}</span><span><b>${esc(t.label)}</b><br><small>${esc(t.blurb)}</small></span></button>`).join('');
      return `<section class="screen">${stepLabel()}<h2 class="q">How much time can you give this over the next few weeks?</h2><p class="sub">Be realistic. Your first move will fit it.</p><div class="grid">${tiles}</div></section>`;
    },
    adverb() {
      const tiles = Object.entries(ADVERBS).map(([id, a]) => `<button class="tile" data-act="adverb" data-v="${attr(id)}" aria-pressed="${S.adverb === id}"><b class="big-b">${esc(a.label)}</b><small>${esc(a.blurb)}</small></button>`).join('');
      return `<section class="screen">${stepLabel()}<h2 class="q">Last one: where are your students weakest?</h2>
        <p class="sub">Pick the one that needs the most work.</p><div class="grid grid-2">${tiles}</div>
        <div class="quote after"><q>${esc(PRINCIPLE_1.text)}</q><span class="src">${esc(PRINCIPLE_1.source)}</span></div></section>`;
    },
    building() {
      return `<section class="screen building"><div class="code">PLAYBOOK ${playbookCode()}</div><h2 class="q">Building your playbook…</h2>
        <ul>${BUILD_STEPS.map((b, i) => `<li data-i="${i}">${esc(b.replace('{n}', ACTIVITIES.length))}</li>`).join('')}</ul></section>`;
    },
    playbook() { return renderPlaybook(generate(), false); },
    error() {
      return `<section class="screen"><h2 class="q">Something went wrong</h2><p class="sub">Sorry about that. Your answers are safe on this device.</p>
        <button class="btn btn-dark btn-wide" data-act="recover">Carry on</button></section>`;
    }
  };

  function guessVerdict() {
    return S.guess < GUESS_LOW ? 'That’s below what the national data suggests. AI use is now the norm, not the exception, and by university it’s almost everyone. Plan for it rather than hope it isn’t happening.'
      : S.guess < 75 ? 'Right in line with the national picture for school students. And by the time they reach university, it’s almost everyone.'
        : "You're under no illusions, and that's where they're heading: 95% at university. The question is no longer whether they use it, but how.";
  }

  function chooseScenarios() {
    const offl = [], surr = [];
    SCENARIOS.forEach((s, i) => (s.answer === 'offload' ? offl : surr).push(i));
    const r = Math.random;
    const a = shuffle(offl, r), b = shuffle(surr, r);
    return shuffle([a[0], b[0], r() < 0.5 ? a[1] : b[1]], r);
  }

  // focus: CSS selector to focus after rendering (keeps keyboard and screen-reader users in place).
  function render(opts = {}) {
    try {
      app.innerHTML = screens[S.screen]();
    } catch (e) {
      S.screen = 'error';
      app.innerHTML = screens.error();
    }
    if (opts.enter && app.firstElementChild) app.firstElementChild.classList.add('enter');
    const dock = $('.dock');
    if (dock) dock.remove();
    document.body.classList.toggle('on-playbook', S.screen === 'playbook');
    const tb = $('.topbar');
    if (tb) document.documentElement.style.setProperty('--top', (S.screen === 'playbook' ? 0 : tb.offsetHeight) + 'px');
    if (S.screen === 'guess') wireGuess();
    if (S.screen === 'speed' && S.speedIdx >= 0 && S.speedIdx < SPEED_PAIRS.length && !S.untimed) runSpeedTimer();
    if (S.screen === 'building') runBuilding();
    if (S.screen === 'playbook') { mountDock(); wireToc(); }
    else if (tocObserver) { tocObserver.disconnect(); tocObserver = null; document.documentElement.style.setProperty('--toc', '0px'); }
    if (opts.focus) {
      const t = $(opts.focus, app);
      if (t) {
        if (!t.matches('button, a, input')) t.setAttribute('tabindex', '-1');
        t.focus({ preventScroll: true });
        if (opts.reveal) t.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
      }
    }
  }
  function rerender(focusSel, reveal) { saveProgress(); render({ focus: focusSel, reveal: !!reveal }); }

  function wireGuess() {
    const r = $('#grange'), n = $('#gnum');
    if (r) r.addEventListener('input', () => { S.guess = +r.value; n.textContent = S.guess + '%'; r.setAttribute('aria-valuetext', S.guess + ' per cent'); });
    requestAnimationFrame(() => setTimeout(() => document.querySelectorAll('.bar > i[data-w]').forEach(i => { i.style.width = i.dataset.w + '%'; }), 60));
  }

  function runSpeedTimer() {
    const bar = $('#tbar');
    if (bar) {
      bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)';
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `transform ${SPEED_SECONDS}s linear`; bar.style.transform = 'scaleX(0)'; }));
    }
    speedTimer = setTimeout(() => {
      S.speed.push('skip'); S.speedIdx++;
      inputLockUntil = Date.now() + (S.speedIdx >= SPEED_PAIRS.length ? 700 : 450);
      rerender('.opt, [data-act="next"]');
      toast('Too slow: next one.');
    }, SPEED_SECONDS * 1000);
  }

  function runBuilding() {
    const items = app.querySelectorAll('.building li');
    const quick = reduceMotion();
    items.forEach((li, i) => buildTimers.push(setTimeout(() => li.classList.add('done'), quick ? 0 : 340 * (i + 1))));
    buildTimers.push(setTimeout(() => go('playbook', { replace: false }), quick ? 300 : 340 * (items.length + 1) + 250));
  }

  // ---------- events ----------
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled || Date.now() < inputLockUntil) return;
    const v = b.dataset.v;
    buzz();
    switch (b.dataset.act) {
      case 'start': go('subject'); break;
      case 'next': next(); break;
      case 'subject': S.subject = v; markPressed(b); advanceSoon(); break;
      case 'age':
        S.ages = S.ages.includes(v) ? S.ages.filter(x => x !== v) : S.ages.concat(v).sort();
        rerender(`[data-act="age"][data-v="${v}"]`);
        announce(`${AGES[v].label} ${S.ages.includes(v) ? 'selected' : 'removed'}`);
        break;
      case 'lock': S.guessLocked = true; inputLockUntil = Date.now() + 450; rerender('.verdict', true); announce(guessVerdict()); break;
      case 'speedgo':
        S.untimed = v === 'untimed'; S.speedIdx = 0; inputLockUntil = Date.now() + 450;
        rerender('.opt');
        if (!S.untimed) announce("Five seconds per choice.");
        break;
      case 'speedpick':
        clearTimeout(speedTimer); b.classList.add('picked'); S.speed.push(v); inputLockUntil = Date.now() + 450;
        advanceTimer = setTimeout(() => {
          S.speedIdx++;
          if (S.speedIdx >= SPEED_PAIRS.length) inputLockUntil = Date.now() + 700; // stray taps can't skip the summary
          rerender('.opt, [data-act="next"]');
        }, 180);
        break;
      case 'scen': S.scenAns[S.scenIdx] = v; rerender('.feedback', true); break;
      case 'scennext': S.scenIdx++; inputLockUntil = Date.now() + 300; rerender('#scentxt, [data-act="next"]'); break;
      case 'worry':
        if (S.worries.includes(v)) S.worries = S.worries.filter(x => x !== v);
        else if (S.worries.length >= 2) { toast('Two at most: tap one of your choices to swap it.'); break; }
        else S.worries.push(v);
        rerender(`[data-act="worry"][data-v="${v}"]`);
        announce(`${S.worries.length} of 2 chosen`);
        break;
      case 'persona': S.persona = v; markPressed(b); advanceSoon(); break;
      case 'kit': S[b.dataset.k] = v; rerender(`[data-act="kit"][data-k="${b.dataset.k}"][data-v="${v}"]`); break;
      case 'conf': S.confidence = +v; markPressed(b); advanceSoon(); break;
      case 'time': S.time = v; markPressed(b); advanceSoon(); break;
      case 'adverb': S.adverb = v; markPressed(b); advanceSoon(); break;
      case 'copy': copyText(b); break;
      case 'openall': {
        const secs = app.querySelectorAll('details.sec');
        const anyClosed = Array.from(secs).some(d => !d.open);
        secs.forEach(d => { d.open = anyClosed; });
        b.textContent = anyClosed ? 'Close every section' : 'Open every section';
        announce(anyClosed ? 'All sections open' : 'All sections closed');
        break;
      }
      case 'recover': go(complete() ? 'playbook' : firstUnanswered()); break;
    }
  });
  function firstUnanswered() {
    if (!S.subject) return 'subject';
    if (!S.ages.length) return 'ages';
    if (!S.worries.length) return 'worries';
    if (!S.persona) return 'persona';
    if (!(S.devices && S.policy && S.tool)) return 'kit';
    if (!S.confidence) return 'confidence';
    if (!S.time) return 'time';
    return 'adverb';
  }
  function markPressed(b) { b.parentElement.querySelectorAll('[aria-pressed]').forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); }

  function copyText(b) {
    const el = document.getElementById(b.dataset.target);
    const txt = el ? el.innerText : '';
    const ok = () => { b.classList.add('done'); b.textContent = 'Copied'; announce('Copied'); setTimeout(() => { b.classList.remove('done'); b.textContent = 'Copy'; }, 1800); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, () => fallbackCopy(txt, ok));
    else fallbackCopy(txt, ok);
  }
  function fallbackCopy(txt, ok) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, txt.length); } catch (e) { /* older browsers */ }
    let done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    ta.remove();
    if (done) ok(); else toast('Couldn’t copy automatically. Press and hold the text to copy it.');
  }
  let tocObserver = null;
  function wireToc() {
    const toc = $('.toc');
    if (tocObserver) tocObserver.disconnect();
    if (toc) document.documentElement.style.setProperty('--toc', toc.offsetHeight + 'px');
    if (toc && window.ResizeObserver) {
      tocObserver = new ResizeObserver(() => document.documentElement.style.setProperty('--toc', toc.offsetHeight + 'px'));
      tocObserver.observe(toc);
    }
    app.querySelectorAll('.toc a').forEach(a => a.addEventListener('click', ev => {
      const target = document.getElementById(a.getAttribute('href').slice(1));
      if (target && target.tagName === 'DETAILS') {
        ev.preventDefault();
        target.open = true;
        target.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
        const sum = target.querySelector('summary');
        if (sum) sum.focus({ preventScroll: true });
      }
    }));
  }

  // ---------- conversations ----------
  // Talking points, not scripts. The student conversation sits with 'If you suspect misuse' and the
  // exams-officer one with the exam rules, so only the class, family, department and DSL ones are chosen here.
  function neaAges() {
    const nea = SUBJECTS[S.subject].nea || {};
    return S.ages.filter(a => a !== 'ks3' && nea[a]);
  }
  function convTags(stance) {
    const tags = new Set([...S.worries, S.persona, stance, ...S.ages]);
    if (S.policy === 'ban') tags.add('ban');
    if (S.policy === 'none' || S.policy === 'progress') tags.add('nopolicy');
    if (neaAges().length) tags.add('nea');
    return tags;
  }
  function shapeConversation(c, tags) {
    const keep = p => typeof p === 'string' || ((!p.tags || p.tags.some(t => tags.has(t))) && !(p.not || []).some(t => tags.has(t)));
    const text = p => (typeof p === 'string' ? p : p.text);
    return {
      id: c.id, title: c.title, aim: typeof c.aim === 'string' ? c.aim : c.aim[S.persona],
      points: c.points.filter(keep).map(text), ask: c.ask.filter(keep).map(text), avoid: c.avoid
    };
  }
  function chooseConversations(role, stance) {
    const tags = convTags(stance);
    const weight = { class: 10, leaders: 10, dsl: S.worries.includes('safeguarding') ? 8.5 : 6, parents: 7, department: tags.has('nopolicy') ? 7.5 : 6 };
    const pool = CONVERSATIONS.filter(c => has(weight, c.id) && c.for.includes(role) && (!c.when || c.when(S)));
    const picked = pool.slice().sort((x, y) => weight[y.id] - weight[x.id]).slice(0, 3);
    return pool.filter(c => picked.includes(c)).map(c => shapeConversation(c, tags));
  }
  // always = show it whatever its own condition says (the student conversation is part of the misuse section).
  function conversation(id, stance, always) {
    const c = CONVERSATIONS.find(x => x.id === id);
    return c && (always || !c.when || c.when(S)) ? shapeConversation(c, convTags(stance)) : null;
  }

  // ---------- playbook generation ----------
  function stanceKey() {
    const g = S.speed.filter(x => x === 'guide').length, d = S.speed.filter(x => x === 'guard').length;
    return g > d ? 'guide' : d > g ? 'guard' : 'mid';
  }
  function confBand() { return S.confidence <= 2 ? 'beginner' : S.confidence === 3 ? 'intermediate' : 'advanced'; }

  // Activities and homework redesigns the five routines already cover, so 'More to try' doesn't repeat them.
  const ROUTINE_ACTS = ['sixty-viva', 'mirror-quiz', 'ready-check', 'plan-in-room', 'ten-minute-write', 'talk-through', 'process-portfolio'];
  const ROUTINE_RDS = ['takehome-talkback', 'inclass-draft', 'prep-perform'];
  // Practical subjects get only the redesigns that fit work that is made rather than written.
  const PRACTICAL_RDS = ['generic-local', 'read-recall'];
  // Adult self-report, US labour data and a university tutor trial are weak evidence for a school classroom:
  // they are kept for leaders and confident users.
  const NARROW_EV = ['lee', 'gerlich', 'canaries', 'kestin'];
  // Prevalence figures are compared with the teacher's guess instead, so they don't also appear as cards.
  const PREVALENCE_EV = ['nlt', 'ofcom', 'hepi'];
  const CORE_EV = ['cepr', 'cepr81', 'bastani', 'scarfe'];
  // A one-lesson first move names an activity, so that activity comes first in 'More to try'.
  const FIRST_ACT = { critically: 'plant-error', effectively: 'brain-first', ethically: 'ethics-tribunal' };

  // The routines a first move already asks for, so 'Do this first' adds two others.
  function firstCovers(kind) {
    if (S.adverb !== 'responsibly') return [];
    if (S.time === 'five') return ['viva'];
    if (S.time === 'lesson') return ['twins', 'viva'];
    return kind === 'practical' ? ['draft', 'viva'] : ['draft', 'twins'];
  }

  function generate() {
    const rng = mulberry32(S.seed ^ hashStr(S.subject + S.ages.join('') + S.adverb));
    const subj = SUBJECTS[S.subject];
    const kind = SUBJECT_KIND[S.subject] || 'written';
    const stance = stanceKey();
    const arch = ARCHETYPES[stance + '-' + (S.confidence <= 2 ? 'low' : 'high')];
    const role = subj.leader ? 'leader' : 'teacher';
    const ban = S.policy === 'ban';
    const examAges = S.ages.filter(a => a !== 'ks3');
    const nea = neaAges();
    const ks3Only = S.ages.length === 1 && S.ages[0] === 'ks3';
    const integrityFocus = S.worries.includes('integrity') || S.worries.includes('outsourcing') || stance === 'guard' || ban || S.persona === 'copy' || S.persona === 'secret';
    const focusAge = pick(S.ages, rng);
    const topicsByAge = {};
    S.ages.forEach(a => { topicsByAge[a] = shuffle(subj.topics[a], rng); });
    const debates = subj.debates.concat(S.ages.some(a => a !== 'ks3') && subj.older ? subj.older : []);
    const tags = new Set([...S.worries, S.adverb, S.persona, stance, ...S.ages]);
    // One example topic per year group keeps the playbook coherent; misconceptions can be keyed by age.
    const misFor = (age) => Array.isArray(subj.mis) ? subj.mis : (subj.mis[age] || subj.mis.ks4 || []);
    const ctxFor = (age) => {
      const topic = topicsByAge[age][0];
      return { topic, age, years: subj.leader ? '[your year group]' : AGES[age].short, task: subj.task[age].replace('{topic}', topic), scheme: subj.scheme[age], weak: subj.weak, mis: pick(misFor(age), rng), debate: pick(debates, rng), local: subj.local, jobs: subj.jobs, check: subj.check, lower: subj.lower };
    };
    const fill = (str, ctx) => str.replace(/\{act:([a-z-]+)\}/g, (m, id) => (ACTIVITIES.find(a => a.id === id) || {}).name || id)
      .replace(/\{(\w+)\}/g, (m, k) => (ctx[k] != null ? ctx[k] : m));
    const tagScore = (list, w = 1) => list.reduce((n, t) => n + (tags.has(t) ? w : 0), 0);
    const ctx0 = ctxFor(focusAge);

    // first move: a value may be keyed by subject kind
    const fm = FIRST_MOVES[S.time][S.adverb];
    const first = subj.leader ? LEADER_FIRST_MOVES[S.time] : fill(typeof fm === 'string' ? fm : (fm[kind] || fm.written), ctx0);

    // the five routines, in their written, problem-solving or practical form
    const routines = ROUTINES.map((r, i) => ({
      id: r.id, n: i + 1, name: r.name, also: r.also, mins: r.mins, what: r.what,
      steps: (r.steps[kind] || r.steps.written).map(st => fill(st, ctx0)),
      homework: r.homework ? (r.homework[kind] || r.homework.written) : '',
      exam: r.exam && kind !== 'practical' && examAges.length ? r.exam : '',
      coursework: r.coursework && nea.length && kind !== 'practical' ? r.coursework : '',
      // the year-group notes are written for text and problems; practical subjects keep the one that fits
      ages: kind === 'practical' && r.id !== 'twins' ? [] : S.ages.map(k => ({ k, t: r.age[k] })).filter(x => x.t),
      evidence: r.evidence
    }));

    let doFirst;
    if (subj.leader) {
      doFirst = [
        { text: 'Agree how staff handle suspected AI misuse, the same way in every department: homework under your school’s own policy, coursework under JCQ’s procedure (section 3).' },
        { text: ban ? 'Check that staff, students and families know what your ban covers, and that it can’t reach homework (section 4).'
          : S.policy === 'have' ? 'Ask a few staff, and separately a few students, what the school’s AI rules are, and compare the answers.'
            : 'Take the five policy questions in section 4 to your leadership team.' }
      ];
    } else {
      const covered = firstCovers(kind);
      doFirst = [...new Set([...DO_FIRST[kind], 'twins', 'viva', 'draft', 'ready'])].filter(id => !covered.includes(id)).slice(0, 2)
        .map(id => routines.find(r => r.id === id)).map(r => ({ name: r.name, n: r.n, text: r.what }));
    }

    // more to try: activities the routines don't already cover
    const actOk = a => !ROUTINE_ACTS.includes(a.id) && !(a.kinds && !a.kinds.includes(kind)) && !(a.essayOnly && !subj.essay) &&
      !(a.notForLeaders && subj.leader) && !(ban && a.studentAI) && !(S.devices === 'none' && a.devices === 'students') &&
      !(a.id === 'declaration' && !nea.length && S.policy !== 'have');
    const scored = ACTIVITIES.filter(actOk).map(a => {
      let s = 0;
      a.worries.forEach(w => { if (S.worries.includes(w)) s += 3; });
      if (a.adverb === S.adverb) s += 3;
      if (a.personas.includes(S.persona)) s += 2;
      if ((S.policy === 'none' || S.policy === 'progress') && a.studentAI) s -= 2;
      if (S.confidence <= 2 && a.prep !== 'ai') s += 1.5;
      if (a.stance === stance) s += 1;
      if (S.confidence <= 2 && a.mins > 30) s -= 2;
      if (S.time === 'five' && a.mins > 20) s -= 1;
      if (a.id === 'ethics-tribunal' && S.subject !== 'pshe' && S.adverb !== 'ethically') s -= 2;
      s += rng() * 3.2;
      return { a, s };
    }).sort((x, y) => y.s - x.s);
    const forcedId = S.time === 'lesson' && !subj.leader ? FIRST_ACT[S.adverb] : null;
    const acts = forcedId ? [ACTIVITIES.find(a => a.id === forcedId)] : [];
    const advs = new Set(acts.map(a => a.adverb));
    for (const { a } of scored) {
      if (acts.length === 3) break;
      if (acts.includes(a)) continue;
      if (acts.length === 2 && advs.size === 1 && advs.has(a.adverb)) continue;
      acts.push(a); advs.add(a.adverb);
    }
    const activities = acts.map(a => ({
      a, ctx: ctx0, usesTopic: a.steps.some(st => /\{(topic|task)\}/.test(st)), steps: a.steps.map(st => fill(st, ctx0)), hook: fill(a.hook, ctx0),
      ages: S.ages.map(k => ({ k, t: a.age[k] })).filter(x => x.t), why: a.why
    }));
    const aiPrep = acts.some(a => a.prep === 'ai' || a.devices === 'teacher');

    // homework redesigns the routines don't already cover
    const rdOk = r => !ROUTINE_RDS.includes(r.id) && !(r.kinds && !r.kinds.includes(kind)) && (kind !== 'practical' || PRACTICAL_RDS.includes(r.id)) &&
      (!r.essayOnly || subj.essay) && !(r.notForLeaders && subj.leader) && (!r.onlyFor || r.onlyFor.includes(S.subject));
    const rds = REDESIGNS.filter(rdOk).map(r => ({ r, s: r.worries.filter(w => S.worries.includes(w)).length * 2 + rng() * 2.5 }))
      .sort((x, y) => y.s - x.s).slice(0, 2)
      .map(({ r }) => { const ctx = ctxFor(pick(S.ages, rng)); return { name: r.name, before: cap(fill(r.before, ctx)), after: fill(r.after, ctx), notes: [r.note, !ban && ctx.age !== 'ks3' ? r.aiNote : ''].filter(Boolean), age: ctx.age }; });

    // watch-outs: a watch-out that matches a chosen worry is boosted so it can't be squeezed out
    const wCand = WATCHOUTS.filter(w => w.when(S, { stance }))
      .map(w => ({ w, r: w.rank + (w.worry && S.worries.includes(w.worry) ? 3 : 0) }))
      .sort((a, b) => b.r - a.r).map(x => x.w);
    const coveredEv = new Set(wCand.slice(0, 4).flatMap(w => w.covers || []));

    // evidence: one card per study, never two identical headline numbers
    const evOk = e => !PREVALENCE_EV.includes(e.id) && !coveredEv.has(e.id) && (!NARROW_EV.includes(e.id) || subj.leader || S.confidence >= 4) && !(e.id === 'eef' && S.confidence === 1);
    const evRanked = EVIDENCE.filter(evOk).map(e => ({ e, s: tagScore(e.tags, 3) + (CORE_EV.includes(e.id) && !subj.leader ? 2 : 0) + rng() * 2 })).sort((x, y) => y.s - x.s);
    const evMax = integrityFocus ? 2 : 3;
    const ev = [], usedSrc = new Set(), usedStat = new Set();
    for (const { e } of evRanked) {
      if (ev.length === evMax) break;
      const src = e.group || e.id;
      if (usedSrc.has(src) || usedStat.has(e.stat)) continue;
      ev.push(e); usedSrc.add(src); usedStat.add(e.stat);
    }
    const evIds = new Set(ev.map(e => e.id));
    const watch = wCand.filter(w => !(w.skipIfEv || []).some(id => evIds.has(id))).slice(0, 3)
      .map(w => ({ id: w.id, title: w.title, html: smartHtml(typeof w.html === 'function' ? w.html(S) : w.html) }));

    // myths: never one that repeats a study already shown, one per group, and none that preaches at the teacher's own school
    const shown = new Set([...evIds, ...watch.map(w => w.id)]);
    const groupOf = m => m.group || (EVIDENCE.find(e => e.id === m.ev) || {}).group || m.ev;
    const mythGroups = new Set(ev.map(e => e.group || e.id));
    const myths = MYTHS.filter(m => !(m.notBan && ban) && !(m.notKs3Only && ks3Only) && !(m.notAvoider && S.confidence === 1) &&
      !(m.ev && shown.has(m.ev)) && !(m.same || []).some(id => shown.has(id)))
      .map(m => ({ m, s: tagScore(m.tags, 2) + rng() * 1.5 })).sort((x, y) => y.s - x.s)
      .filter(({ m }) => { const k = groupOf(m); if (!k) return true; if (mythGroups.has(k)) return false; mythGroups.add(k); return true; })
      .slice(0, 2).map(x => x.m);

    const prompts = ban ? [] : STUDENT_PROMPTS.filter(p => (!p.essayOnly || subj.essay) && (!p.onlyFor || p.onlyFor.includes(S.subject)) && !(p.notFor || []).includes(S.subject)).map(p => {
      let s = rng() * 2;
      if (p.adverbs.includes(S.adverb)) s += 3;
      p.worries.forEach(w => { if (S.worries.includes(w) || w === S.persona) s += 1.5; });
      return { p, s };
    }).sort((x, y) => y.s - x.s).slice(0, 2)
      .map(({ p }) => ({ name: p.name, text: fill(p.text, ctx0), note: p.note || '' }));

    const words = GLOSSARY.map(g => ({ g, s: tagScore(g.tags, 2) + rng() * 2 })).sort((x, y) => y.s - x.s).slice(0, 3).map(x => x.g);

    // pathway (steps that point to the training list only appear when it exists)
    const okStep = p => (!p.tags.some(t => /^ks\d$/.test(t)) || p.tags.some(t => S.ages.includes(t))) && (!p.needsCpd || LIB.cpd.length) &&
      (!p.role || p.role === role) && !((p.studentAI || p.notBan) && ban) && !(p.nea && !nea.length);
    // a pathway step never repeats a routine or the first move
    const repeats = p => (role === 'teacher' && /closed-book twins|explain-back|Move the planning/.test(p.text)) ||
      (S.adverb === 'ethically' && S.time === 'unit' && /^Go through your school's AI rules/.test(p.text));
    const term = PATHWAY_TERM.filter(okStep).filter(p => !repeats(p)).map(p => ({ p, s: tagScore(p.tags, 2) + rng() })).sort((x, y) => y.s - x.s).slice(0, 2).map(x => fill(x.p.text, ctx0));
    const year = PATHWAY_YEAR[role].filter(okStep).map(p => ({ p, s: tagScore(p.tags, 2) + rng() })).sort((x, y) => y.s - x.s).slice(0, 2).map(x => fill(x.p.text, ctx0));

    // free training: a cautious or ban-school teacher is pointed to the DfE modules, not a vendor course
    const band = confBand();
    const cautious = S.confidence <= 2 || ban;
    const cpdRanked = LIB.cpd.map(c => {
      let s = rng();
      if (c.level === band) s += 4;
      if (c.level === 'all') s += 2.5;
      if (subj.leader && c.tags && c.tags.includes('leader')) s += 2;
      if (S.subject === 'computing' && c.tags && c.tags.includes('computing')) s += 2;
      if (S.subject !== 'computing' && c.tags && c.tags.includes('computing')) s -= 3;
      if (!subj.leader && c.levelLabel === 'Leaders') s -= 3;
      if (c.tags && c.tags.includes('ks5') && !S.ages.includes('ks5') && S.subject !== 'vocational') s -= 2;
      if (c.tags && c.tags.some(t => S.ages.includes(t))) s += 0.5;
      if (c.vendor && cautious) s -= 2;
      return { c, s };
    }).sort((x, y) => y.s - x.s).map(x => x.c);
    // the avoiders' one-hour route already links its course, so the pathway and training list don't repeat it
    const routeUrls = (S.confidence <= 2 || S.worries.includes('confidence')) && typeof AVOIDER_ROUTE !== 'undefined' ? AVOIDER_ROUTE.map(r => r.url) : [];
    const findCpd = re => LIB.cpd.find(c => re.test(c.url));
    const dfeCourse = findCpd(/using-ai-in-education-settings/);
    const course = subj.leader ? (findCpd(/bcs\.org/) || cpdRanked[0])
      : cautious ? (dfeCourse || cpdRanked[0]) : (cpdRanked.find(c => !c.vendor && c.length !== 'Policy reading' && !routeUrls.includes(c.url)) || cpdRanked[0]);
    const cpd = cpdRanked.filter(c => c !== course && !routeUrls.includes(c.url)).slice(0, 3);
    const tools = S.confidence === 1 ? [] : LIB.tools.slice(0, 3);

    // resource shelf: never a link shown elsewhere in the playbook, and always something for families and students
    const examUrls = [...LIB.jcqDocs, ...LIB.boardWide, ...LIB.epq, ...LIB.vocational, ...Object.values(LIB.boardLinks).flat()].map(x => x.url);
    const avoidUrls = typeof AVOIDER_ROUTE === 'undefined' ? [] : AVOIDER_ROUTE.map(r => r.url).filter(Boolean);
    const seen = new Set([...Object.values(FACTS).map(f => f.url), ...tools.map(x => x.url), ...examUrls, ...avoidUrls, ...INTEGRITY.links.map(r => r.url), course ? course.url : '', ...cpd.map(c => c.url), ...(LIB.subjectLinks[S.subject] || []).map(r => r.url), ...LIB.unis.map(u => u.url)]);
    // coursework resources only where the subject has coursework at the chosen key stages
    const res = RESOURCES.filter(r => !seen.has(r.url) && !(r.coursework && !nea.length)).map(r => {
      let s = rng() * 2.2;
      S.ages.forEach(a => { if (r.tags.includes(a)) s += 1.5; });
      S.worries.forEach(w => { if (r.tags.includes(w)) s += 2.5; });
      if (subj.leader && r.tags.includes('leader')) s += 3;
      if (!subj.leader && r.tags.includes('teacher')) s += 1;
      if (S.confidence <= 2 && r.tags.includes('starter')) s += 2;
      if (S.subject === 'computing' && r.tags.includes('computing')) s += 3;
      if (S.policy !== 'have' && r.tags.includes('policy')) s += 1.5;
      if (r.tags.includes('core')) s += 1;
      if (r.tags.includes('ks5') && !S.ages.includes('ks5') && !r.tags.some(t => S.ages.includes(t))) s -= 3;
      return { r, s };
    }).sort((x, y) => y.s - x.s).map(x => x.r);
    const shelf = [];
    const take = r => { if (r && shelf.length < 5 && !shelf.includes(r)) shelf.push(r); };
    const tagged = tag => res.find(r => r.tags.includes(tag));
    take(tagged('parents')); take(tagged('students'));
    if (S.worries.includes('safeguarding') || S.ages.includes('ks3')) take(tagged('safeguarding'));
    res.forEach(take);
    shelf.sort((a, b) => res.indexOf(a) - res.indexOf(b));

    return {
      code: playbookCode(), subj, kind, arch, stance, focusAge, role, band, ban, nea, examAges, integrityFocus, cautious,
      first, doFirst, routines, activities, aiPrep, rds, ev, watch, words, myths, prompts, term, year, course, dfeCourse, cpd, tools, shelf,
      prevalence: [ks3Only ? GUESS_EVIDENCE[0] : GUESS_EVIDENCE[1], GUESS_EVIDENCE[2]],
      talks: chooseConversations(role, stance), studentTalk: role === 'teacher' ? conversation('student', stance, true) : null,
      examTalk: conversation('exams', stance), neighbour: pick(NEIGHBOUR, rng), debate: pick(debates, rng),
      scenRight: S.scen.filter((s, i) => SCENARIOS[s] && SCENARIOS[s].answer === S.scenAns[i]).length
    };
  }

  // ---------- playbook render ----------
  function resLink(r, tag, body) {
    if (!/^https:\/\//.test(r.url)) return '';
    return `<a href="${attr(r.url)}" target="_blank" rel="noopener"><em>${esc(tag)}</em><b>${esc(r.title)}</b><span>${esc(body)}</span></a>`;
  }

  function renderPlaybook(P, forDownload) {
    const subjName = P.subj.name;
    const persona = PERSONAS.find(p => p.id === S.persona);
    const copyBtn = (id) => forDownload ? '' : `<button class="copy" data-act="copy" data-target="${id}">Copy</button>`;
    const sections = [];
    const add = (id, nav, title, lead, html, open) => { if (html) sections.push({ id, nav, title, lead, html, open: !!open }); };
    // a document linked in one section isn't repeated in a later one
    const usedLinks = new Set();
    const unshown = items => items.filter(r => !usedLinks.has(r.url) && usedLinks.add(r.url));
    const ul = items => `<ul>${items.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
    const srcLinks = l => l.map(([label, url]) => link(url, label)).join(' · ');
    const yearsOf = ages => ages.map(a => AGES[a].short).join(' and ');
    const talkCard = c => `<div class="card talk"><h3>${esc(c.title)}</h3><p class="aim">${esc(c.aim)}</p>
      <h4>Points to cover</h4>${ul(c.points)}${c.ask.length ? `<h4>Questions to ask</h4>${ul(c.ask)}` : ''}<h4>Avoid</h4>${ul(c.avoid)}</div>`;
    const leader = P.subj.leader;

    // 1. Do this first
    const firstItems = [`<li>${esc(P.first)}</li>`, ...P.doFirst.map(d => `<li>${d.name ? `<b>${esc(d.name)}</b> (routine ${d.n} below): ` : ''}${esc(d.text)}</li>`)].join('');
    const suspectLine = `<p class="suspect"><b>If you suspect AI:</b> ${leader ? 'for homework, staff start with a conversation and a redo in the room, under your school’s policy' : 'for homework, start with a conversation and a redo in the room, under your school’s policy'}${P.nea.length ? '. For coursework, don’t sign it off: record your concerns and tell your exams officer (JCQ)' : ''}. Never rely on a detector alone. Section 3 has the detail.</p>`;
    add('first', 'Do this first', 'Do this first', `Sized to the time you said you have: ${TIMES.find(t => t.id === S.time).label.toLowerCase()}.`,
      `<div class="card firstmove"><div class="t">Three things for the next fortnight</div><ol class="dofirst">${firstItems}</ol>${suspectLine}</div>`);

    // 2. Five routines
    const rCard = r => `<div class="card routine"><h3><span class="rn">${r.n}</span>${esc(r.name)}</h3><p class="sub">${esc(r.also)} · ${esc(r.mins)}</p>
      <p>${esc(r.what)}</p><ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
      ${r.ages.map(a => `<div class="note"><b>${esc(AGES[a.k].short)}:</b> ${esc(a.t)}</div>`).join('')}
      ${r.homework ? `<div class="note"><b>On the homework:</b> ‘${esc(r.homework)}’</div>` : ''}
      ${r.exam ? `<div class="note"><b>Exam practice:</b> ${esc(r.exam)}</div>` : ''}
      ${r.coursework ? `<div class="note"><b>Coursework:</b> ${esc(r.coursework)}</div>` : ''}
      <div class="note"><span class="badge g">${esc(r.evidence.label)}</span> ${esc(r.evidence.text)}</div></div>`;
    add('routines', 'Routines', 'Five routines that protect learning',
      leader ? 'To share with staff. None needs student devices or AI, and each works whatever your AI policy.' : `None needs student devices or AI, and each works whatever your school’s AI policy.${P.kind === 'practical' ? ' Shown in their practical form.' : ''}`,
      `<div class="card principle"><p>${esc(INTEGRITY.principle)}</p></div>${P.routines.map(rCard).join('')}
       <p class="small">${esc(INTEGRITY.deviceFree)} ${esc(INTEGRITY.honesty)}</p>`);

    // 3. If you suspect misuse
    const intLinks = unshown(INTEGRITY.links.filter(r => (!r.ages || r.ages.some(a => S.ages.includes(a))) && (r.org !== 'JCQ' || P.nea.length)));
    add('misuse', 'Misuse', 'If you suspect misuse', leader ? 'What staff should do, in order, and what to avoid.' : 'What to do, in order, and what to avoid.',
      `<div class="card"><h3>Ordinary homework, classwork and mocks</h3>${ul(INTEGRITY.suspect.homework)}<p class="small">${esc(INTEGRITY.suspect.cloze)}</p></div>
       ${P.nea.length ? `<div class="card"><h3>Coursework and NEA${leader ? '' : ` (${esc(yearsOf(P.nea))})`}</h3>${ul(INTEGRITY.suspect.coursework)}</div>` : ''}
       ${P.studentTalk ? talkCard(P.studentTalk) : ''}
       <p class="small"><b>On AI detectors:</b> ${esc(INTEGRITY.suspect.detectors)}</p>
       ${intLinks.length ? `<h4 class="res-head">Worth having</h4><div class="res">${intLinks.map(r => resLink(r, r.org, r.desc)).join('')}</div>` : ''}`);

    // 4. Your school's rules, and conversations
    const banCard = P.ban || (leader && S.policy !== 'have') ? `<div class="card"><h3>${P.ban ? 'Working within your ban' : 'If your school bans student AI'}</h3>${ul(INTEGRITY.ban)}</div>` : '';
    const policyCard = S.policy === 'none' || S.policy === 'progress' || leader ? `<div class="card"><h3>${S.policy === 'have' ? 'Questions to revisit in your policy' : S.policy === 'ban' ? 'Five questions a ban still has to answer' : S.policy === 'progress' ? 'Five questions your policy must settle' : 'No policy yet? Five questions to settle'}</h3><ol>${POLICY_QUESTIONS.map(q => `<li>${esc(q)}</li>`).join('')}</ol></div>` : '';
    const ruleCard = `<div class="card"><h3>One line on every task</h3><p>${esc(INTEGRITY.ruleLine[P.ban ? 'ban' : 'other'])}</p></div>`;
    const poster = LIB.jcqDocs.find(d => /poster/i.test(d.title));
    const examOnly = !leader && P.examAges.length && !P.nea.length ? `<div class="card"><h3>Exam rules for ${esc(lc(subjName))}</h3><p>${esc(P.subj.assessed)}</p>
      <p>So JCQ’s AI rules for coursework don’t apply to your ${esc(yearsOf(P.examAges))} work: homework, classwork and mocks fall under your school’s own policy (section 3). If you also teach a course with coursework, such as a BTEC, run the playbook again for that course.</p>
      ${poster ? `<p class="small">For your classroom wall: ${link(poster.url, poster.title)} (JCQ).</p>` : ''}</div>` : '';
    add('rules', 'Rules', P.ban ? 'Your school’s ban, and conversations to have' : 'Your school’s rules, and conversations to have',
      leader ? 'Clear decisions, and the conversations that make them stick. Talking points, not scripts.' : `Talking points, not scripts, shaped by your class (‘${lc(persona.label)}’). Put them in your own words.`,
      banCard + policyCard + ruleCard + examOnly + `<h3 class="res-head">Conversations to consider having</h3>` + P.talks.map(talkCard).join(''));

    // 5. Exam rules, only where the subject has coursework at the chosen key stages
    if (P.nea.length && LIB.jcq.length) {
      const levelName = { ks4: 'GCSE', ks5: 'A level' };
      const forAges = x => !x.ages || x.ages.some(a => P.nea.includes(a));
      const ov = LIB.overviews[S.subject] || {};
      const overviewHtml = P.nea.filter(a => ov[a]).map(a => `<p><b>${levelName[a]} assessment at a glance:</b> ${ov[a].map(([label, url]) => link(url, label)).join(' · ')}</p>`).join('');
      const subjLinks = (LIB.boardLinks[S.subject] || []).filter(forAges);
      const vocLinks = LIB.vocational.filter(x => x.subjects.includes(S.subject) && forAges(x));
      const subjectCard = leader ? '' : `<div class="card"><h3>${esc(subjName)}: what’s assessed</h3><p>${esc(P.subj.assessed)}</p>${overviewHtml}
        ${subjLinks.length || vocLinks.length ? '' : `<p class="small">No exam board publishes AI guidance specific to ${esc(P.subj.lower)} at this level, so the JCQ rules and the board-wide guidance below apply.</p>`}</div>`;
      const group = (title, list) => { const items = unshown(list); return items.length ? `<h4 class="res-head">${esc(title)}</h4><div class="res">${items.map(b => resLink(b, b.board, b.desc)).join('')}</div>` : ''; };
      add('exams', 'Exam rules', 'Coursework and exam-board rules', `What JCQ and the exam boards expect for ${leader ? 'coursework and NEA' : yearsOf(P.nea) + ' coursework'}, with direct links. Checked October 2026.`,
        `<div class="card"><h3>The JCQ rules in brief</h3>${ul(LIB.jcq.filter(p => !/JCQ\/M1/.test(p)))}<p class="small">${esc(JCQ_SECTIONS)} For what to do if you suspect misuse, see section 3.</p></div>
         ${subjectCard}
         ${P.examTalk ? talkCard(P.examTalk) : ''}
         ${group(leader ? 'Subject guidance' : `AI guidance for ${P.subj.lower}`, subjLinks)}
         ${group('Vocational and technical qualifications', vocLinks)}
         ${group('JCQ and Ofqual: the documents themselves', LIB.jcqDocs)}
         ${group('Board-wide AI guidance', LIB.boardWide)}
         ${P.nea.includes('ks5') ? group('The Extended Project (EPQ)', LIB.epq) : ''}`);
    }

    // 6. For teachers who avoid AI or rate their confidence low
    if (S.confidence <= 2 || S.worries.includes('confidence')) {
      const fillEx = t => t.replace('{years}', AGES[P.focusAge].short).replace('{lower}', P.subj.lower);
      const points = `<div class="card"><h3>What you still need to know</h3><ol class="points">${AVOIDER_POINTS.map(p => `<li><b>${esc(p.title)}</b> ${esc(p.text)} <span class="src">${srcLinks(p.src)}</span></li>`).join('')}</ol></div>`;
      const route = `<div class="card"><h3>A one-hour route, in order</h3><ol>${AVOIDER_ROUTE.map(r => `<li>${r.url ? link(r.url, r.title) : esc(r.title)} (${esc(r.org)}${r.length ? ', ' + esc(r.length) : ''})</li>`).join('')}</ol></div>`;
      const exercise = `<div class="card"><h3>See it for yourself: a private 15-minute test-drive</h3>
        <p class="small">Not using AI with students: just enough of a look to recognise what they can now produce.</p>
        <h4>Before you start</h4>${ul(AVOIDER_EXERCISE.before)}
        <h4>Six steps</h4><ol>${AVOIDER_EXERCISE.steps.map(([h, t]) => `<li><b>${esc(h)}.</b> ${esc(fillEx(t))}</li>`).join('')}</ol>
        <p class="small">${esc(AVOIDER_EXERCISE.close)}</p></div>`;
      add('avoid', S.confidence === 1 ? 'If you avoid AI' : 'New to AI', S.confidence === 1 ? 'If you avoid AI' : 'If you’re new to AI',
        "You don't need to use AI to teach well. You do need to know what your students can do with it.", points + route + exercise, S.confidence === 1);
    }

    // 7. Why this matters
    const bar = (label, value, cls) => `<div class="bar-row"><div class="lab"><span>${esc(label)}</span><b>${value}%</b></div><div class="bar ${cls}"><i style="width:${value}%"></i></div></div>`;
    const guessBlock = `<div class="card"><div class="bars flush">${bar('Your guess for your students', S.guess, 'you')}${P.prevalence.map(e => bar(e.label, e.value, 'evb')).join('')}</div></div>`;
    const evCard = (stat, text, src) => `<div class="ev"><div class="stat">${esc(stat)}</div><p>${esc(text)}</p><div class="src">${src}</div></div>`;
    const fig = P.integrityFocus ? evCard(INTEGRITY.figure.stat, INTEGRITY.figure.text, link(INTEGRITY.figure.src[1], INTEGRITY.figure.src[0])) : '';
    const mythHtml = P.myths.map(m => {
      const e = EVIDENCE.find(x => x.id === m.ev);
      const src = m.src ? link(FACTS[m.src.key].url, m.src.label) : e ? link(e.url, e.source) + (e.caveat ? ' · ' + esc(e.caveat) : '') : '';
      return `<div class="card myth"><div class="m">Myth: ${esc(m.myth)}</div><p><b>Reality:</b> ${esc(m.truth)}</p>${src ? `<div class="src">${src}</div>` : ''}</div>`;
    }).join('');
    add('evidence', 'Evidence', 'Why this matters', 'Your guess against the national figure, the research that speaks to your worries, and two beliefs worth challenging.',
      guessBlock + `<div class="ev-grid">${fig}${P.ev.map(e => evCard(e.stat, e.text, link(e.url, e.source) + (e.caveat ? ' · ' + esc(e.caveat) : ''))).join('')}</div>` + mythHtml);

    // 8. More to try
    const extra = (typeof SUBJECT_EXTRA !== 'undefined' && SUBJECT_EXTRA[S.subject]) || null;
    const spot = [
      leader ? '' : `<li><b>Where AI trips up:</b> in ${esc(P.subj.lower)}, AI ${esc(P.subj.weak)}. Use that in your teaching.</li>`,
      extra && !P.ban ? `<li><b>Good uses${S.policy === 'have' ? '' : ', where your school allows them'}:</b> ${extra.good.map(esc).join('; ')}.</li>` : '',
      extra ? `<li><b>Where to draw the line:</b> ${esc(extra.line)}</li>` : '',
      extra && extra.tip ? `<li><b>See their real level:</b> ${esc(extra.tip)}</li>` : '',
      leader ? '' : `<li><b>A debate to run:</b> ${esc(P.debate)}</li><li><b>Make it harder to outsource:</b> anchor tasks in ${esc(P.subj.local)}.</li>
        <li><b>The human edge:</b> think of ${esc(P.subj.jobs)}${P.subj.edge ? ', ' + esc(P.subj.edge) : ''}.</li>`
    ].join('');
    const actCard = (x, open) => `
      <details class="card act" ${open ? 'open' : ''}>
        <summary><span class="meta"><span class="badge y">${x.a.mins ? x.a.mins + ' min' : 'Ongoing'}</span><span class="badge g">${x.a.prep === 'ai' ? 'You prepare an AI example' : x.a.devices === 'teacher' ? 'One screen' : 'No AI needed'}</span></span>
          <span class="act-title">${esc(x.a.name)}</span><span class="hook">${esc(x.hook)}</span><span class="more" aria-hidden="true">Show the steps ▾</span></summary>
        <div class="body">${x.usesTopic && !leader ? `<div class="note first"><b>Example topic:</b> ${esc(cap(x.ctx.topic))}, ${esc(AGES[x.ctx.age].short)}. Swap in your own.</div>` : ''}
          <ol>${x.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
          ${x.ages.map(a => `<div class="note"><b>Adapt for ${esc(AGES[a.k].short)}:</b> ${esc(a.t)}</div>`).join('')}
          <div class="note"><b>Why it works:</b> ${esc(x.why)}</div></div>
      </details>`;
    const rdHtml = P.rds.map(r => `<div class="card"><h3>${esc(r.name)} <span class="badge">${esc(AGES[r.age].short)}</span></h3>
        <div class="flip"><div class="from"><small>Before</small>${esc(r.before)}</div><div class="to"><small>After</small>${esc(r.after)}</div></div>${r.notes.map(n => `<p class="small rd-note"><b>For you:</b> ${esc(n)}</p>`).join('')}</div>`).join('');
    const fuller = S.ages[0] !== 'ks3';
    const wordsHtml = `<dl class="gloss">${P.words.map(g => `<div><dt>${esc(g.term)}</dt><dd>${esc(fuller ? g.fuller : g.simple)}</dd></div>`).join('')}</dl>`;
    const actIds = new Set(P.activities.map(x => x.a.id));
    const kit = [
      S.adverb === 'ethically' || actIds.has('ethics-tribunal') || S.subject === 'pshe' || leader
        ? `<div class="card"><h3>Six dilemma cards</h3><p class="small">${actIds.has('ethics-tribunal') ? 'For ‘The ethics tribunal’: fair, unfair or ‘it depends’, and on what?' : 'Give each group a card to rule on: fair, unfair or ‘it depends’, and on what?'}</p><div class="script" id="kitdilemmas">${COPY_KIT.dilemmas.map((d, i) => `${i + 1}. ${esc(d)}`).join('<br>')}</div>${copyBtn('kitdilemmas')}</div>` : '',
      S.policy === 'have'
        ? `<div class="card"><h3>An AI declaration box for practice work</h3><p class="small">For practice work only${P.nea.length ? '. For coursework and NEA, use your awarding body’s authentication sheet and the JCQ candidate declaration, which already ask about AI: don’t add or substitute your own' : ''}. Pair the box with something you can check, such as a draft written in class.</p><div class="script" id="kitdecl">${esc(S.ages.includes('ks3') && !P.examAges.length ? COPY_KIT.declarationKs3 : COPY_KIT.declaration)}</div>${copyBtn('kitdecl')}</div>` : '',
      S.subject === 'pshe' || leader
        ? `<div class="card"><h3>The help ladder (for PSHE or tutor time)</h3><p class="small">Eight kinds of homework help, in no particular order. Students rank them from ‘does it for me’ to ‘makes me think harder’. Ranking won’t change behaviour on its own: pair it with a closed-book check on the next homework.</p><div class="script" id="kitladder">${COPY_KIT.ladder.map(d => esc(d)).join('<br>')}</div>${copyBtn('kitladder')}</div>` : ''
    ].join('');
    const promptHtml = P.prompts.length ? `<h3 class="res-head">Prompts to give your students</h3><p class="small">${S.policy === 'have' ? 'For an AI tool your school has approved for your students’ age. Each one keeps the thinking with the student.' : 'Only where your school allows students to use AI, and the tool suits their age (most are 13+). Each one keeps the thinking with the student.'}</p>` +
      P.prompts.map((p, i) => `<div class="card"><h3>${esc(p.name)}</h3><div class="script mono" id="prompt${i}">${esc(p.text)}</div>${copyBtn('prompt' + i)}${p.note ? `<p class="small">${esc(p.note)}</p>` : ''}</div>`).join('') : '';
    const toolNote = !P.aiPrep ? '' : S.tool === 'copilot' || S.tool === 'gemini'
      ? ` Where an activity needs an AI example, make it in your school-approved ${S.tool === 'copilot' ? 'Microsoft Copilot' : 'Google Gemini'} account and check it before the lesson.`
      : ' Where an activity needs an AI example, use only a tool your school allows staff to use, from your own account, with no student names or data.';
    const avoidNote = P.aiPrep && S.confidence <= 2 ? ' Rather not use AI yourself? Write the example yourself, or ask a colleague: the thinking for students is the same.' : '';
    add('more', 'More to try', 'More to try',
      `Chosen from ${ACTIVITIES.length} activities for the skill your students need most, your worries and your class.${P.ban ? ' None asks students to use AI.' : ''}${toolNote}${avoidNote}`,
      P.activities.map((x, i) => actCard(x, i === 0)).join('') +
      `<div class="card spotlight"><h3>${esc(subjName)} spotlight</h3><ul>${spot}</ul></div>` +
      (rdHtml ? `<h3 class="res-head">Two more homework redesigns</h3>${rdHtml}` : '') +
      `<h3 class="res-head">Words to teach</h3>${wordsHtml}` + (kit ? `<h3 class="res-head">Ready to copy</h3>${kit}` : '') + promptHtml);

    // 9. The year ahead
    const c = P.course;
    const courseLine = c ? `<p><b>Your free course:</b> ${link(c.url, c.title)} (${esc(c.org)}${c.length ? ', ' + esc(lc(c.length)) : ''})${c === P.dfeCourse && P.cautious ? ': start with the module on using AI safely' : ''}.</p>` : '';
    const runway = S.ages.map(a => { const r = RUNWAY[P.ban && RUNWAY[a + 'ban'] ? a + 'ban' : a]; return `<div class="stage"><h3>${esc(r.title)}</h3><ul>${Object.entries(r.items).map(([k, t]) => `<li>${k === S.adverb ? '<b>' + esc(t) + '</b>' : esc(t)}</li>`).join('')}</ul></div>`; }).join('') +
      `<div class="stage uni"><h3>${esc(RUNWAY.uni.title)}</h3><ul>${RUNWAY.uni.items.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
    const sixth = S.ages.includes('ks5') || leader;
    const ucas = LIB.ucas && S.ages.includes('ks5') ? `<div class="card"><h3>${esc(LIB.ucas.title)}</h3>${ul(LIB.ucas.points)}<ul class="plain links">${LIB.ucas.links.map(l => `<li>${link(l.url, l.label)}</li>`).join('')}</ul></div>` : '';
    const uniList = (ne) => LIB.unis.filter(u => !!u.ne === ne).map(u => `<li>${link(u.url, u.name)}: ${esc(u.summary)}</li>`).join('');
    const unis = sixth && LIB.unis.length ? `<div class="card"><h3>What universities tell new students</h3><p class="small">${S.ages.includes('ks5') ? 'Share these with Years 12 and 13 before they apply.' : 'Useful context for sixth-form staff, students and families.'} ${esc(LIB.uniIntro)}</p>
      <h4>North East universities</h4><ul class="plain">${uniList(true)}</ul><h4>Russell Group examples</h4><ul class="plain">${uniList(false)}</ul></div>` : '';
    add('year', 'Year ahead', 'The year ahead', 'Two steps for this half-term, two for the year, and where your students are heading.',
      `<ol class="path">
        <li><span class="when">This half-term</span>${P.term.map(t => `<p>${esc(t)}</p>`).join('')}</li>
        <li><span class="when">This year</span>${P.year.map(t => `<p>${esc(t)}</p>`).join('')}${courseLine}</li>
      </ol>
      <h3 class="res-head">The road to university</h3>
      <div class="card p1"><div class="kicker on-dark">Where your students are heading</div><p class="p1q"><q>${esc(PRINCIPLE_1.text)}</q></p>
        <div class="words">${Object.entries(ADVERBS).map(([k, a]) => `<span class="${k === S.adverb ? 'hot' : ''}">${esc(a.label)}</span>`).join('')}</div>
        <p>${esc(ADVERBS[S.adverb].uni)}</p><p class="muted-dark">${esc(PRINCIPLE_1.sector)}</p><span class="src">${esc(PRINCIPLE_1.source)}</span></div>
       <div class="runway" style="--cols:${Math.min(S.ages.length + 1, 4)}">${runway}</div>${ucas}${unis}`);

    // 10. Library
    const boards = [...LIB.jcqDocs, ...LIB.boardWide, ...Object.values(LIB.boardLinks).flat(), ...LIB.vocational];
    const sl = (LIB.subjectLinks[S.subject] || []).filter(r => (!r.ages || r.ages.some(a => S.ages.includes(a))) && !P.cpd.some(x => x.url === r.url) && !(c && c.url === r.url) && !boards.some(x => x.url === r.url) && !usedLinks.has(r.url));
    const training = `<h3 class="res-head">Free training for you</h3>
      ${P.cpd.length ? `<div class="res">${P.cpd.map(x => resLink(x, (x.levelLabel || cap(x.level)) + (x.length ? ' · ' + x.length : '') + (x.vendor ? ' · Vendor course' : ''), x.org + ': ' + x.desc)).join('')}</div>` : ''}
      ${P.tools.length ? `<div class="card"><h3>Free AI tools for teachers</h3><ul class="plain">${P.tools.map(t => `<li>${link(t.url, t.title)} (${esc(t.org)}): ${esc(t.desc)}</li>`).join('')}</ul><p class="small">Use tools your school has approved, signed in with your school account.</p></div>` : ''}`;
    add('library', 'Library', 'Library', `Training, resources and watch-outs, matched to your answers (you spotted ${P.scenRight} of ${S.scen.length} in offload or surrender). All free; some need a free account.`,
      training +
      (sl.length ? `<h3 class="res-head">${leader ? 'For leaders and governors' : `${esc(subjName)}: free resources`}</h3><div class="res">${sl.map(r => resLink(r, r.org, r.desc)).join('')}</div>` : '') +
      `<h3 class="res-head">Your resource shelf</h3><div class="res">${P.shelf.map(r => resLink(r, r.type, r.org + ': ' + r.desc)).join('')}</div>` +
      (P.watch.length ? `<h3 class="res-head">Watch-outs for your context</h3>${P.watch.map(w => `<div class="card watch"><h3>${esc(w.title)}</h3>${w.html}</div>`).join('')}` : ''));

    const toc = forDownload ? '' : `<nav class="toc" aria-label="Playbook sections">${sections.map(s => `<a href="#${s.id}">${esc(s.nav)}</a>`).join('')}</nav>`;
    // The first four sections open by default (and 'If you avoid AI' for avoiders); printing prints only open sections.
    const secHtml = sections.map((s, i) => `
      <details class="sec" id="${s.id}" ${i < 4 || s.open ? 'open' : ''}>
        <summary><h2><span class="n">${i + 1}<span class="sr-only">.</span></span> ${esc(s.title)}</h2></summary>
        <div class="sec-body"><p class="lead">${esc(s.lead)}</p>${s.html}</div>
      </details>`).join('');
    const built = S.secs ? `Built in ${mmss(S.secs)}` : 'Your playbook';
    // Key studies: only those this playbook cites, by link or by the first author's name.
    const body = sections.map(s => s.html + s.lead).join(' ');
    const alias = { 'HEPI and Kortext': 'HEPI', 'Education Endowment Foundation': 'EEF' };
    const refs = REFERENCES.filter(r => { const k = r.cite.split(/ \(|, /)[0]; return body.includes(attr(r.url)) || body.includes(alias[k] || k); });

    return `<section class="screen playbook">
      <div class="pb-hero">
        <span class="code">PLAYBOOK ${P.code}</span>
        <div class="arch"><span class="ic" aria-hidden="true">${esc(P.arch.icon)}</span><div><div class="kicker on-dark">Your AI teaching archetype</div><h1>${esc(P.arch.name)}</h1></div></div>
        <p class="tag">${esc(P.arch.tagline)}</p>
        <div class="chips"><span>${esc(subjName)}</span><span>${esc(S.ages.map(a => AGES[a].short).join(', '))}</span><span>${esc(persona.label)}</span>${S.worries.map(w => `<span>${esc(WORRIES.find(x => x.id === w).label)}</span>`).join('')}</div>
        <details class="arch-more"><summary>Your strength, blind spot and next step</summary><div class="trio"><div><b>Your strength</b>${esc(P.arch.strength)}</div><div><b>Your blind spot</b>${esc(P.arch.blind)}</div><div><b>Your next step</b>${esc(P.arch.grow)}</div></div></details>
        <div class="unique">${built} · ${sections.length} sections${S.fromLink || forDownload ? '' : ' · Nobody else in the room has this playbook.'}</div>
      </div>
      ${toc}
      ${forDownload ? '<p class="small no-print">Tap a section heading to open it. Only open sections print.</p>' : '<div class="openall"><button class="linkbtn" data-act="openall">Open every section</button></div>'}
      ${secHtml}
      ${forDownload || S.fromLink ? '' : `<div class="neighbour"><b>Right now, in the room</b>${esc(P.neighbour)}</div>`}
      <details class="refs-wrap"><summary>Key studies cited</summary><ul class="refs">${refs.map(r => `<li>${link(r.url, r.cite)}</li>`).join('')}</ul></details>
      <footer class="credit">${esc(CREDIT)}${forDownload ? '' : ' Run it again for another class and you will get a different playbook.'}</footer>
    </section>`;
  }

  function mountDock() {
    const d = document.createElement('div');
    d.className = 'dock';
    d.setAttribute('aria-label', 'Playbook actions');
    const canShare = !!navigator.share;
    d.innerHTML = `<button class="main" data-dock="pdf">Save PDF</button><button data-dock="share">${canShare ? 'Share' : 'Copy link'}</button><button data-dock="download">Download</button><button data-dock="again">Another class</button>`;
    document.body.appendChild(d);
    d.addEventListener('click', e => {
      const b = e.target.closest('[data-dock]'); if (!b) return;
      buzz();
      const act = b.dataset.dock;
      if (act === 'pdf') {
        if (isWebView()) { toast('Open this page in your browser to save it as a PDF.'); return; }
        toast('Printing the open sections. Open any others you want first.');
        setTimeout(() => window.print(), 600);
      }
      if (act === 'share') {
        const url = shareUrl();
        const copyIt = () => fallbackCopy(url, () => toast('Link copied. It reopens this exact playbook.'));
        if (navigator.share) navigator.share({ title: 'My AI-ready classroom playbook', text: 'My AI-ready classroom playbook (' + playbookCode() + ')', url }).catch(err => { if (!err || err.name !== 'AbortError') copyIt(); });
        else if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(() => toast('Link copied. It reopens this exact playbook.'), copyIt);
        else copyIt();
      }
      if (act === 'download') downloadPlaybook();
      if (act === 'again') {
        let ok = true;
        try { ok = window.confirm('Start a new playbook for another class? You can use Back to return to this one.'); } catch (e) { ok = true; }
        if (!ok) return;
        const keep = { subject: S.subject };
        S = fresh(); Object.assign(S, keep);
        go('ages');
      }
    });
  }

  function downloadPlaybook() {
    if (isWebView()) { toast('Open this page in your browser to download it.'); return; }
    const css = document.getElementById('css').textContent;
    const body = renderPlaybook(generate(), true);
    const html = `<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="only light"><title>AI-ready classroom playbook ${playbookCode()}</title><style>${css}</style></head><body class="on-playbook"><main>${body}<p class="refs"><a href="${esc(shareUrl())}">Reopen this playbook online</a></p></main></body></html>`;
    const blob = new Blob([html], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `ai-playbook-${playbookCode()}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast('Download started.');
  }

  // ---------- history, visibility and boot ----------
  window.addEventListener('popstate', ev => {
    const m = location.hash.match(/#p=([A-Za-z0-9_-]+)/);
    const restored = m && decodeState(m[1]);
    if (restored) { S = restored; go('playbook', { fromHistory: true }); return; }
    const scr = ev.state && ev.state.screen;
    if (scr && STEPS.includes(scr)) {
      if (scr === 'speed') { S.speed = []; S.speedIdx = -1; }
      if (scr === 'surrender') { S.scen = []; S.scenAns = []; S.scenIdx = 0; }
      if (scr === 'guess') S.guessLocked = false;
      go(scr, { fromHistory: true });
    } else if (!scr || scr === 'intro') {
      go('intro', { fromHistory: true });
    }
  });
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/#p=([A-Za-z0-9_-]+)/);
    const r = m && decodeState(m[1]);
    if (r) { S = r; go('playbook', { fromHistory: true }); }
  });
  document.addEventListener('visibilitychange', () => {
    if (S.screen !== 'speed' || S.untimed || S.speedIdx < 0 || S.speedIdx >= SPEED_PAIRS.length) return;
    if (document.hidden) clearTimeout(speedTimer); else render({ focus: '.opt' }); // restart the current pair with a full five seconds
  });
  // Only open sections print, but every card inside an open section prints in full.
  window.addEventListener('beforeprint', () => document.querySelectorAll('details.sec[open] details, details.arch-more').forEach(x => { x.open = true; }));
  const topbar = $('.topbar');
  if (window.ResizeObserver && topbar) new ResizeObserver(() => document.documentElement.style.setProperty('--top', topbar.offsetHeight + 'px')).observe(topbar);
  if (/[?&]debug\b/.test(location.search)) {
    window.__playbook = { state: () => S, load: (o) => { S = Object.assign(fresh(), o); }, generate: () => generate(), render: (dl) => renderPlaybook(generate(), !!dl), go, decode: decodeState, encode: encodeState };
  }

  const m = location.hash.match(/#p=([A-Za-z0-9_-]+)/);
  const restored = m && decodeState(m[1]);
  if (restored) { S = restored; go('playbook', { replace: true }); }
  else {
    const saved = !m && loadProgress();
    if (saved) { S = saved; go(saved.screen, { replace: true }); toast('Welcome back. Carry on where you left off.'); }
    else { go('intro', { replace: true }); }
  }
})();
</script>
</body>
</html>
