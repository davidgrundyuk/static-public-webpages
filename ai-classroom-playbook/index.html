<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>AI-ready classroom playbook</title>
<meta name="description" content="Eleven quick-fire questions, then a personalised playbook of AI literacy activities, homework redesigns, talking points, evidence and free resources for your classroom.">
<meta name="theme-color" content="#051435">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23051435'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23FDC82F'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23051435'/%3E%3C/svg%3E">
<style id="css">:root {
  color-scheme: light;
  --navy: #051435; --navy-2: #0b2350; --blue: #0073BC; --sky: #29B7EA; --yellow: #FDC82F; --red: #DA1A35;
  --ink: #0f1b2d; --muted: #4f6077; --bg: #eef3f9; --card: #ffffff; --line: #d6e0ec; --soft: #e6f4fb;
  --good: #0b6b44; --good-bg: #e3f6ec; --bad: #a8102a; --bad-bg: #fde8eb;
  --radius: 14px; --shadow: 0 1px 2px rgba(5, 20, 53, .06), 0 6px 20px rgba(5, 20, 53, .07);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --top: 46px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--top) + var(--toc, 0px) + 8px); scroll-padding-bottom: 96px; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg); line-height: 1.55; font-size: 16px; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
a { color: var(--blue); text-underline-offset: 2px; }
p { margin: 0 0 10px; }
:focus-visible { outline: 3px solid #005a94; outline-offset: 2px; }
.intro :focus-visible, .speed :focus-visible, .quote :focus-visible, .pb-hero :focus-visible, .p1 :focus-visible, .dock :focus-visible, .topbar :focus-visible { outline-color: var(--yellow); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Chrome */
.topbar { background: var(--navy); color: #fff; padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left)); display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 30; min-height: var(--top); }
.topbar .brand { font-size: 14px; letter-spacing: .02em; }
.topbar .brand b { color: var(--sky); font-weight: 700; }
.topbar .clock { font-variant-numeric: tabular-nums; font-size: 14px; background: rgba(255, 255, 255, .14); padding: 3px 10px; border-radius: 99px; }
.progress { height: 5px; background: rgba(41, 183, 234, .18); }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sky), var(--yellow)); transition: width .35s ease; }

main { max-width: 780px; margin: 0 auto; padding: 18px calc(16px + env(safe-area-inset-right)) 32px calc(16px + env(safe-area-inset-left)); }
body.on-playbook main { padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
.screen.enter { animation: enter .3s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.kicker { text-transform: uppercase; letter-spacing: .12em; font-size: 13px; font-weight: 700; color: #005a94; margin: 6px 0 4px; }
.kicker.on-dark { color: var(--sky); margin: 0 0 6px; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
h3 { font-size: 17px; color: var(--navy); margin-bottom: 8px; }
.q { font-size: clamp(24px, 6.4vw, 32px); font-weight: 800; color: var(--navy); margin: 0 0 6px; outline: none; }
.sub { color: var(--muted); margin: 0 0 18px; }
.small { font-size: 14px; color: var(--muted); }

/* Intro */
.intro { background: var(--navy); color: #fff; border-radius: 22px; padding: 26px 20px; position: relative; overflow: hidden; }
.intro::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(41, 183, 234, .45), transparent 70%); pointer-events: none; }
.intro h1 { font-size: clamp(30px, 8.6vw, 46px); font-weight: 800; letter-spacing: -.01em; position: relative; margin-bottom: 12px; }
.intro h1 span { color: var(--yellow); }
.intro p { color: #d7e4f5; position: relative; }
.intro .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 22px; position: relative; }
.intro .facts span { background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .2); padding: 6px 12px; border-radius: 99px; font-size: 14px; }
.privacy { font-size: 14px; color: var(--muted); margin-top: 14px; }
.hint { margin: 4px 0 0; }
@media (max-height: 700px) {
  .intro { display: flex; flex-direction: column; }
  .intro .btn { order: 1; }
  .intro .facts { order: 2; margin: 14px 0 0; }
}
@media (max-width: 359px) {
  .intro { padding: 22px 16px; }
  .intro h1 { font-size: 28px; }
  .intro .facts { margin: 12px 0 16px; }
  .q { font-size: 23px; }
}

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 22px; min-height: 52px; font-weight: 700; font-size: 17px; transition: transform .08s ease, background .2s ease, opacity .2s; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--yellow); color: var(--navy); }
.btn-dark { background: var(--navy); color: #fff; }
.btn-ghost-dark { background: transparent; color: #fff; border: 2px solid rgba(255, 255, 255, .55); }
@media (hover: hover) { .btn-ghost-dark:hover { border-color: #fff; } }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-wide { width: 100%; }
.stick { position: sticky; bottom: 0; z-index: 5; margin: 18px -16px 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, rgba(238, 243, 249, 0)); }
.linkbtn { background: none; border: 0; color: var(--blue); font-weight: 700; font-size: 15px; padding: 10px 0; min-height: 44px; text-decoration: underline; text-underline-offset: 3px; }

/* Tiles */
.grid { display: grid; gap: 10px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .grid-4s { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 64px; transition: border-color .15s, background .15s, transform .08s; box-shadow: var(--shadow); }
.tile:active { transform: scale(.98); }
@media (hover: hover) { .tile:hover { border-color: var(--sky); } }
.tile .ic { font-size: 24px; line-height: 1; }
.tile b { font-size: 15px; color: var(--navy); }
.tile small { color: var(--muted); font-size: 14px; line-height: 1.35; }
.tile[aria-pressed="true"] { border-color: var(--blue); background: var(--soft); }
.tile { position: relative; }
.tile.multi[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 6px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 13px; font-weight: 800; display: grid; place-items: center; }
.tile.row { flex-direction: row; align-items: center; gap: 12px; }
.tile.row .ic { font-size: 28px; flex: none; }
.tile.center { align-items: center; justify-content: center; text-align: center; min-height: 58px; }
.tile.compact { min-height: 56px; padding: 10px; gap: 9px; }
.tile.compact .ic { font-size: 22px; }
.tile.compact b { font-size: 14px; line-height: 1.25; }
.tile[disabled] { cursor: default; }
.big-b { font-size: 18px !important; }

/* Gut check */
.slider-wrap { background: var(--card); border-radius: 18px; padding: 22px 18px; box-shadow: var(--shadow); text-align: center; }
.big-num { font-size: 64px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; line-height: 1; user-select: none; -webkit-user-select: none; }
input[type=range] { width: 100%; margin: 22px 0 6px; accent-color: var(--blue); height: 40px; touch-action: pan-y; }
.range-ends { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.bars { margin-top: 16px; display: grid; gap: 12px; text-align: left; }
.bars.flush { margin-top: 0; }
.bar-row .lab { font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
.bar-row .lab b { font-variant-numeric: tabular-nums; flex: none; white-space: nowrap; }
.bar { height: 14px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 99px; transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }
.bar.you > i { background: var(--yellow); }
.bar.evb > i { background: var(--blue); }
.verdict { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 15px; text-align: left; }

/* Speed round */
.speed { background: var(--navy); border-radius: 22px; padding: 18px; color: #fff; text-align: center; }
.speed .count { font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--sky); }
.speed-intro { font-size: 18px; margin: 10px 0 16px; }
.timer { height: 8px; background: rgba(255, 255, 255, .15); border-radius: 99px; overflow: hidden; margin: 12px 0 16px; }
.timer > i { display: block; height: 100%; background: var(--yellow); width: 100%; }
.speed .vs { display: grid; gap: 10px; }
.speed .opt { border: 0; border-radius: 16px; padding: 22px 14px; min-height: 92px; font-size: 22px; font-weight: 800; background: #fff; color: var(--navy); transition: transform .08s, background .15s; }
.speed .opt:active { transform: scale(.97); }
.speed .opt.picked { background: var(--yellow); }
.speed .or { font-size: 13px; color: #9fb4d3; text-transform: uppercase; letter-spacing: .14em; }
@media (min-width: 640px) { .speed .vs { grid-template-columns: 1fr auto 1fr; align-items: center; } .speed .opt { min-height: 140px; } }

/* Offload or surrender */
.defs { display: grid; gap: 8px; margin-bottom: 14px; }
.def { background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 15px; border-left: 4px solid var(--sky); }
.def.s { border-left-color: var(--red); }
.scenario { background: var(--card); border-radius: 18px; padding: 20px 18px; box-shadow: var(--shadow); }
.scenario .who { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.scenario p.txt { font-size: 20px; font-weight: 700; color: var(--navy); margin: 6px 0 16px; }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 15px; }
.feedback.ok { background: var(--good-bg); color: var(--good); }
.feedback.no { background: var(--bad-bg); color: var(--bad); }
.pill-count { display: inline-block; background: var(--navy); color: #fff; border-radius: 99px; padding: 2px 10px; font-size: 13px; font-weight: 700; }

/* Kit check */
.seg-group { margin: 0 0 16px; padding: 0; border: 0; }
.seg-group .lbl { font-weight: 700; color: var(--navy); margin-bottom: 6px; font-size: 15px; padding: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px; min-height: 48px; font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { border-color: var(--blue); background: var(--blue); color: #fff; }

/* Confidence */
.conf { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.conf .tile { align-items: center; text-align: center; padding: 12px 4px; }
.conf .tile .ic { font-size: 30px; }
.conf .tile small { font-size: 13px; }
@media (max-width: 639px) {
  .conf { grid-template-columns: 1fr; }
  .conf .tile { flex-direction: row; justify-content: flex-start; gap: 14px; padding: 12px 14px; }
  .conf .tile small { font-size: 15px; color: var(--navy); }
  .grid-2.grid-4s { gap: 8px; }
}

.quote { background: var(--navy); color: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; font-size: 15px; }
.quote.after { margin: 16px 0 0; }
.quote q { font-style: italic; }
.quote .src { display: block; margin-top: 8px; font-size: 14px; color: #b9c9df; }

.building { text-align: center; padding: 30px 10px; }
.building .code { font-size: 14px; letter-spacing: .14em; color: var(--blue); font-weight: 700; }
.building .q { margin-top: 8px; }
.building ul { list-style: none; padding: 0; margin: 22px auto 0; max-width: 380px; text-align: left; }
.building li { padding: 8px 0; color: var(--muted); display: flex; gap: 10px; align-items: center; transition: color .2s; }
.building li.done { color: var(--navy); font-weight: 600; }
.building li::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.building li.done::before { background: var(--good); border-color: var(--good); box-shadow: inset 0 0 0 3px #fff; }

/* Playbook hero */
.pb-hero { background: var(--navy); color: #fff; border-radius: 22px; padding: 22px 18px; position: relative; overflow: hidden; }
.pb-hero::after { content: ""; position: absolute; right: -70px; bottom: -90px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(253, 200, 47, .32), transparent 70%); pointer-events: none; }
.pb-hero .code { display: inline-block; background: var(--yellow); color: var(--navy); font-weight: 800; letter-spacing: .12em; padding: 4px 10px; border-radius: 8px; font-size: 13px; }
.pb-hero .arch { display: flex; align-items: center; gap: 14px; margin: 16px 0 6px; position: relative; }
.pb-hero .arch .ic { font-size: 44px; }
.pb-hero h1 { font-size: clamp(28px, 7.4vw, 40px); font-weight: 800; }
.pb-hero .tag { color: #d7e4f5; margin: 0 0 14px; position: relative; font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; position: relative; }
.chips span { background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .22); border-radius: 99px; padding: 4px 10px; font-size: 14px; }
/* On a phone, keep the hero short so 'Do this first' starts on the first screen. */
@media (max-width: 420px) {
  .chips span { font-size: 13px; padding: 2px 8px; }
  .pb-hero .arch { margin-top: 10px; }
  .pb-hero .arch .ic { font-size: 36px; }
  .unique { margin-top: 6px; }
}
.trio { display: grid; gap: 8px; margin-top: 16px; position: relative; }
@media (min-width: 640px) { .trio { grid-template-columns: repeat(3, 1fr); } }
.trio div { background: rgba(255, 255, 255, .08); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.trio b { display: block; color: var(--sky); font-size: 13px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 2px; }
.arch-more { position: relative; margin-top: 4px; }
.arch-more > summary { cursor: pointer; color: var(--sky); font-weight: 700; font-size: 15px; min-height: 44px; display: flex; align-items: center; }
.arch-more .trio { margin-top: 6px; }
.unique { position: relative; margin-top: 14px; font-size: 14px; color: #b9c9df; }

/* Section menu */
body.on-playbook .topbar { display: none; }
.toc { position: sticky; top: 0; z-index: 20; display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; margin: 0 -16px; background: var(--bg); scrollbar-width: none; -webkit-overflow-scrolling: touch; border-bottom: 1px solid var(--line); }
.toc::-webkit-scrollbar { display: none; }
.toc a { flex: none; text-decoration: none; background: var(--card); border: 1px solid var(--line); color: var(--navy); border-radius: 99px; padding: 8px 13px; font-size: 14px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }
@media (min-width: 768px) { .toc { flex-wrap: wrap; overflow-x: visible; } }
.openall { text-align: right; }
@media (min-width: 900px) { .openall { display: none; } }

/* Sections */
.sec { margin-top: 14px; background: transparent; }
.sec > summary { list-style: none; cursor: pointer; padding: 14px 44px 14px 0; position: relative; border-bottom: 1px solid var(--line); }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::after { content: ""; position: absolute; right: 8px; top: 22px; width: 11px; height: 11px; border-right: 3px solid var(--blue); border-bottom: 3px solid var(--blue); transform: rotate(45deg); transition: transform .2s; }
.sec[open] > summary::after { transform: rotate(-135deg); top: 28px; }
.sec > summary h2 { font-size: 21px; color: var(--navy); font-weight: 800; display: flex; align-items: center; gap: 10px; }
.sec > summary h2 .n { background: var(--blue); color: #fff; border-radius: 8px; font-size: 14px; padding: 2px 8px; flex: none; }
.sec > summary .lead { display: block; color: var(--muted); margin-top: 4px; font-size: 15px; }
.sec-body { padding-top: 12px; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; overflow-wrap: anywhere; }
.card p:last-child { margin-bottom: 0; }
.firstmove { border-left: 6px solid var(--yellow); font-size: 17px; }
.dofirst { padding-left: 22px; margin: 6px 0 0; }
.dofirst li { margin-bottom: 10px; }
.suspect { font-size: 15px; background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 6px 0 0; }
.routine h3 { display: flex; align-items: center; gap: 8px; }
.routine .rn { background: var(--navy); color: #fff; border-radius: 8px; font-size: 14px; padding: 2px 8px; flex: none; }
.routine .sub { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
.firstmove .t {font-size: 13px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--blue); margin-bottom: 4px; }

.path { list-style: none; margin: 0; padding: 0; }
.path li { position: relative; padding: 0 0 16px 26px; }
.path li::before { content: ""; position: absolute; left: 6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--blue); }
.path li::after { content: ""; position: absolute; left: 11px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
.path li:last-child::after { display: none; }
.path .when { display: block; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
.path p { background: var(--card); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); margin-bottom: 8px; overflow-wrap: anywhere; }

.ev-grid { display: grid; gap: 10px; }
@media (min-width: 640px) { .ev-grid { grid-template-columns: repeat(3, 1fr); } }
.ev { background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); border-top: 4px solid var(--blue); display: flex; flex-direction: column; overflow-wrap: anywhere; }
.ev .stat { font-size: 32px; font-weight: 800; color: var(--blue); line-height: 1.1; }
.ev p { font-size: 15px; margin: 6px 0 8px; flex: 1; }
.src { font-size: 14px; color: var(--muted); }
.src a, .refs a { display: inline-block; padding: 4px 0; }

.act { padding: 0; overflow: hidden; }
.act summary { list-style: none; padding: 16px; cursor: pointer; display: grid; gap: 4px; }
.act summary::-webkit-details-marker { display: none; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 13px; font-weight: 700; border-radius: 99px; padding: 3px 9px; background: var(--soft); color: #005a94; display: inline-block; }
.badge.y { background: #fff3cc; color: #6b4f00; }
.badge.g { background: var(--good-bg); color: var(--good); }
.act .act-title { font-size: 18px; font-weight: 800; color: var(--navy); line-height: 1.25; }
.more-head { margin: 18px 0 10px; font-size: 18px; }
.rd-note { margin: 8px 0 0; }
.principle { background: var(--navy); color: #fff; font-size: 17px; font-weight: 600; }
.principle p { margin: 0; }
.talk .aim { color: var(--muted); font-size: 15px; }
.points li { margin-bottom: 10px; }
.points .src { display: block; }
.res-head { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #005a94; margin: 16px 0 8px; }
.talk h4:first-of-type { margin-top: 10px; }
.talk ul { margin-bottom: 4px; }
.talk li { margin-bottom: 4px; }
.act .hook { color: var(--muted); font-size: 15px; }
.act .more { font-size: 14px; color: var(--blue); font-weight: 700; }
.act[open] .more { display: none; }
.act .body { padding: 0 16px 16px; }
.act ol { padding-left: 22px; margin: 8px 0 12px; }
.act ol li { margin-bottom: 7px; }
.note { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-top: 8px; }
.note.first { margin-top: 0; }
.note b, .card li b { color: var(--navy); }
.plain { list-style: none; padding: 0; margin: 0; }
.plain li { padding: 10px 0; border-top: 1px solid var(--line); }
.plain li:first-child { border-top: 0; padding-top: 0; }
.plain.links { margin-top: 10px; }
.card h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--blue); margin: 14px 0 6px; }
.spotlight { border-left: 5px solid var(--sky); }
.spotlight ul, .card ul { padding-left: 20px; margin: 4px 0 0; }
.spotlight li { margin-bottom: 6px; }

.flip { display: grid; gap: 8px; }
.flip .from, .flip .to { border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.flip .from { background: var(--bad-bg); }
.flip .to { background: var(--good-bg); }
.flip small { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; margin-bottom: 2px; }
.flip .from small { color: var(--bad); }
.flip .to small { color: var(--good); }

.script { font-size: 16px; background: var(--soft); border-radius: 12px; padding: 14px; }
.script.mono { font-family: Consolas, Menlo, "Courier New", monospace; font-size: 14px; line-height: 1.5; }
.copy { margin-top: 10px; border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 16px; min-height: 44px; font-weight: 700; font-size: 15px; color: var(--navy); }
.copy.done { border-color: var(--good); color: var(--good); }

.gloss { margin: 0; display: grid; gap: 10px; }
@media (min-width: 640px) { .gloss { grid-template-columns: 1fr 1fr; } }
.gloss div { background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.gloss dt { font-weight: 800; color: var(--navy); margin-bottom: 4px; }
.gloss dd { margin: 0; font-size: 15px; }
.myth .m { font-weight: 800; color: var(--bad); margin-bottom: 6px; }
.watch { border-left: 5px solid var(--red); }
.watch p { margin: 6px 0 0; font-size: 15px; }

.p1 { background: var(--navy); color: #fff; }
.p1 .p1q { margin: 0; }
.p1 .words { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.p1 .words span { border: 1px solid rgba(255, 255, 255, .3); border-radius: 99px; padding: 4px 12px; font-weight: 700; }
.p1 .words span.hot { background: var(--yellow); color: var(--navy); border-color: var(--yellow); }
.p1 .muted-dark { color: #c9d7ea; }
.p1 .src { font-size: 13px; color: #9fb4d3; }
.runway { display: grid; gap: 10px; margin-bottom: 12px; }
@media (min-width: 640px) { .runway { grid-template-columns: repeat(var(--cols, 3), 1fr); } }
.runway .stage { background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); border-top: 4px solid var(--sky); }
.runway .stage.uni { border-top-color: var(--yellow); }
.runway .stage h3 { font-size: 15px; }
.runway .stage ul { font-size: 15px; padding-left: 18px; margin: 8px 0 0; }

.res { display: grid; gap: 8px; margin-bottom: 12px; }
@media (min-width: 640px) { .res { grid-template-columns: 1fr 1fr; } }
.res a { display: block; text-decoration: none; background: var(--card); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); color: var(--ink); border-left: 4px solid var(--blue); min-height: 48px; overflow-wrap: anywhere; }
.res a b { color: var(--navy); display: block; }
.res a span { font-size: 14px; color: var(--muted); }
.res a em { font-style: normal; font-size: 13px; color: #005a94; font-weight: 700; }

.neighbour { background: var(--yellow); color: var(--navy); border-radius: 18px; padding: 18px; font-weight: 600; margin-top: 22px; }
.neighbour b { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .1em; }
.refs-wrap { margin-top: 22px; }
.refs-wrap summary { font-weight: 700; color: var(--navy); cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 12px; list-style: none; }
.refs-wrap summary::-webkit-details-marker { display: none; }
.refs-wrap summary::after { content: ""; width: 9px; height: 9px; border-right: 3px solid var(--blue); border-bottom: 3px solid var(--blue); transform: rotate(45deg); margin-top: -4px; transition: transform .2s; }
.refs-wrap[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
.refs { font-size: 14px; color: var(--muted); padding-left: 20px; overflow-wrap: anywhere; }
.refs li { margin-bottom: 6px; }
footer.credit { margin-top: 22px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* Bottom action bar */
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(5, 20, 53, .97); padding: 6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left)); display: flex; gap: 6px; justify-content: center; z-index: 40; }
.dock button { border: 0; border-radius: 10px; padding: 8px 4px; min-height: 44px; font-weight: 700; font-size: 14px; white-space: nowrap; background: rgba(255, 255, 255, .14); color: #fff; flex: 1 1 0; max-width: 170px; }
.dock button.main { background: var(--yellow); color: var(--navy); }
@media (max-width: 359px) { .dock button { font-size: 13px; } }
.toast { position: fixed; left: 16px; right: 16px; margin: 0 auto; width: max-content; max-width: min(520px, calc(100% - 32px)); bottom: calc(76px + env(safe-area-inset-bottom)); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 15px; z-index: 50; box-shadow: 0 6px 20px rgba(5, 20, 53, .25); }
body:not(.on-playbook) .toast { bottom: calc(96px + env(safe-area-inset-bottom)); }
@media (max-height: 480px) and (orientation: landscape) {
  .stick { position: static; background: none; }
  .topbar { position: static; }
  .toc { position: static; }
}

/* Short screens: keep the answers in view */
@media (max-height: 700px) {
  .defs { gap: 6px; margin-bottom: 10px; }
  .def { font-size: 14px; padding: 7px 10px; line-height: 1.4; }
  .scenario { padding: 14px 16px; }
  .scenario p.txt { font-size: 18px; margin: 4px 0 12px; }
  .q { margin-bottom: 4px; }
}

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

@media print {
  body { background: #fff; font-size: 12px; }
  .topbar, .progress, .dock, .toc, .copy, .toast, .openall, .neighbour, .no-print { display: none !important; }
  main { padding: 0; max-width: none; }
  .card, .ev, .runway .stage, .res a, .gloss div, .path p { box-shadow: none; border: 1px solid #ccd6e3; break-inside: avoid; }
  .pb-hero, .p1, .quote { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sec > summary::after, .act .more { display: none; }
  a { color: var(--ink); }
  .res a::after, .src a::after, .refs a::after, .card p a::after, .card li a::after { content: " (" attr(href) ")"; font-size: 10px; color: #4f6077; overflow-wrap: anywhere; }
  .res a::after { display: block; }
  .sec { break-inside: auto; }
  .sec > summary { break-after: avoid; }
}
</style>
</head>

    html: () => `<p>${FACTS.ageLimits.text}</p><p>AI companions and image tools bring new risks: emotional dependence, sextortion, and deepfake or 'nudify' abuse. Treat any incident as a safeguarding matter for your DSL. Don't save or forward images. If a student discloses something during a lesson on these topics, follow your safeguarding procedure and speak to your DSL the same day. Young people can use ${lnk(FACTS.reportRemove.url, "Childline's Report Remove")} to get sexual images of themselves taken down, including AI-made ones, and ${lnk(FACTS.ceop.url, 'CEOP')} takes reports of online sexual abuse. ${FACTS.kcsie.text} ${lnk(FACTS.kcsie.url, 'Read the KCSIE 2026 summary')}.</p>` },

    html: `<p>Students who are fluent with AI aren't necessarily critical of it. Give them harder jobs: catching errors, checking sources, defending their choices out loud. Fluency isn't the same as judgement.</p>` },

      : `<p>If declaring AI use gets students into trouble, they'll hide it. On practice work, reward honest declarations and separate 'how did you use it?' from 'did you break a rule?' Check that this matches your school's behaviour policy before you promise it to a class. Be clear that coursework is different: exam-board rules apply there whatever a student declares.${S.confidence >= 3 ? ' Model your own use openly.' : ''}</p>` },

<script>
// Conversations to consider having: talking points, not scripts. Nothing here is meant to be read out or copied.
// Each point may carry tags; a tagged point only appears when a tag matches the teacher's answers
// (worries, persona, ages, stance, 'ban' / 'nopolicy' for the school's policy, or 'nea' where the subject has coursework).
// not = tags that hide the point, such as a ban.
const CONVERSATIONS = [
  {
    id: 'leaders', title: 'With your leadership team and governors', for: ['leader'],
    aim: 'Turn worry into a small number of clear, school-wide decisions.',
    points: [
      { text: 'What our rules are for students, in school and for homework, and whether staff and students would describe them the same way.' },
      { text: 'What a ban on student AI use does and does not cover, especially work done at home.', tags: ['ban'] },
      { text: 'How every department checks authorship, and how suspected misuse is handled consistently.' },
      { text: 'Which tools staff may use, and what data protection checks have been done.' },
      { text: 'Where AI literacy is taught, and by whom, from Year 7.' },
      { text: "How KCSIE 2026's content on AI-generated images and chatbots is reflected in our safeguarding training.", tags: ['safeguarding', 'ks3'] }
    ],
    ask: [
      'What would a student say our AI rules are?',
      'Where would we see the first signs of AI-related malpractice or harm?'
    ],
    avoid: [
      'A policy written once and never explained to students or families.',
      'Assuming a ban in school changes what happens at home.'
    ]
  },
  {
    id: 'class', title: 'With your class', for: ['teacher'],
    aim: {
      copy: "Some of them hand in polished homework that their test results don't match. Make the link between practice and learning explicit, without accusing anyone.",
      secret: "They use AI but won't say so. Your aim is to make honesty a safer choice than hiding it.",
      anxious: "They avoid AI because they think it's cheating. Tell them that protecting their own thinking is right, and be clear about the rules.",
      power: 'They are fluent with AI tools. Raise the bar: fluency is not the same as judgement.',
      mixed: 'They range from avoiders to heavy users. Give everyone the same clear test for when AI helps and when it harms.'
    },
    points: [
      { text: "Homework is practice, not a product. If AI does the practice, the learning doesn't happen." },
      { text: 'In one large study, students who started using AI got better homework marks and worse exam marks.', tags: ['copy', 'outsourcing', 'thinking'] },
      { text: "One test for any use of AI: 'Is this the bit I'm supposed to be learning?'" },
      { text: "What the school's rules are, in lessons and for homework, and what happens when work isn't their own." },
      { text: "Why the school doesn't allow students to use AI in school: explain the reason, not just the rule.", tags: ['ban'] },
      { text: 'Owning up to how they used AI on practice work is better than hiding it.', tags: ['secret', 'integrity'], not: ['ban'] },
      { text: 'Coursework has strict exam-board rules on AI, and breaking them is malpractice.', tags: ['nea'] },
      { text: 'Most AI chatbots are for ages 13 and over.', tags: ['ks3'] },
      { text: "There's no AI in the exam hall: the thinking they practise now is the thinking they'll have then.", tags: ['ks4'] },
      { text: "At university, many will have to say how, why and when they used AI, and may have to explain their work in person.", tags: ['ks5'] }
    ],
    ask: [
      { text: 'If someone your age got AI to do tonight’s homework, what would they be missing tomorrow?' },
      { text: 'Which homework would be pointless to hand to anyone else, a friend or an AI? Why?' },
      { text: 'How would you know if an AI answer was wrong?' }
    ],
    avoid: [
      "Claiming you can always tell when work is AI-written. You can't, and they know it.",
      "Promising an amnesty that your behaviour policy doesn't allow.",
      'Turning it into a lecture: ask more than you tell.'
    ]
  },
  {
    id: 'student', title: 'With a student whose work you doubt', for: ['teacher'],
    when: S => S.worries.includes('integrity') || S.worries.includes('outsourcing') || S.persona === 'copy' || S.persona === 'secret' || S.policy === 'ban',
    aim: 'Find out whether the work is theirs, fairly and without accusation.',
    points: [
      { text: 'Before you talk, compare the work with what they produce in class, and look at any plans, drafts or notes.' },
      { text: 'Ask them to talk you through it: how they planned it, why they made the key choices, and what one section means.' },
      { text: 'If you still have doubts, ask them to redo a short part, or explain a key idea, in front of you.' },
      { text: 'Keep short, factual notes of what was said and what you checked.' }
    ],
    ask: [
      'Can you talk me through how you did this?',
      'Why did you choose this example, method or point?',
      'What does this part mean, in your own words?',
      "Did you use any tools or help? It's better to tell me now."
    ],
    avoid: [
      'Opening with an accusation.',
      'Treating fluent or well-structured writing as proof of AI use on its own.',
      "Deciding before you've heard them out."
    ]
  },
  {
    id: 'parents', title: 'With parents and carers', for: ['teacher', 'leader'],
    aim: 'Help families support the thinking at home, and know the rules.',
    points: [
      { text: "What the school's rules on AI are, in lessons and for homework." },
      { text: "That the school doesn't allow students to use AI in school, and why.", tags: ['ban'] },
      { text: 'Homework is practice: very fast, perfect homework can be a sign that something else did the thinking.' },
      { text: 'The simplest check at home is to ask their child to explain one thing they learned, in their own words.' },
      { text: 'Many AI apps are 13+, and some need parental consent for under-18s.', tags: ['ks3'] },
      { text: "Coursework must be the student's own: exam boards treat AI misuse as malpractice.", tags: ['nea'] },
      { text: 'Where universities allow AI, they expect students to use it critically and to declare how they used it.', tags: ['ks5'] },
      { text: 'AI companions and image tools bring new risks, and who to contact in school if they are worried.', tags: ['safeguarding'] }
    ],
    ask: [
      'How long does homework usually take at home?',
      'Have you noticed AI apps being used for schoolwork?'
    ],
    avoid: [
      'Alarmist language or technical jargon.',
      "Sending your own wording before checking whether the school has already agreed what to say to families."
    ]
  },
  {
    id: 'department', title: 'With your department', for: ['teacher'],

<script>(function () {

    epq: typeof EPQ_LINKS === 'undefined' ? [] : EPQ_LINKS,

    ucas: typeof UCAS_INFO === 'undefined' ? null : UCAS_INFO,

  function fresh() {

  // ---------- utilities ----------
  // Text is escaped and given typographic quotes and apostrophes.
  function esc(s) {
